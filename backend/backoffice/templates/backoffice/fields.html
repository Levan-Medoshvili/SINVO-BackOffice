{% load office %}{% if form.non_field_errors %}<div class="notice error" role="alert">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}<div class="field {% if field.field.widget.input_type == 'checkbox' %}field-wide checks{% endif %} {% if field.errors %}invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label|tr }}{% if field.field.required %}<span class="required" aria-label="required">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div>
