{% load office %}{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pages">{% if page.has_previous %}<a class="button subtle small" href="?q={{ q|urlencode }}&amp;page={{ page.previous_page_number }}">{{ 'Previous'|tr }}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button subtle small" href="?q={{ q|urlencode }}&amp;page={{ page.next_page_number }}">{{ 'Next'|tr }}</a>{% endif %}</nav>{% endif %}
